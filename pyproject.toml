[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-handshake"
version = "0.1.0"
description = "Reference implementation of trust establishment between autonomous agents before digital commerce."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maneesh Raswan" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trust-demo = "demo:main"

[tool.setuptools]
packages = ["trust"]
py-modules = ["demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
